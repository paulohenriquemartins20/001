<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#14395B;--green:#2E8B57;--ink:#182433;--muted:#5B6878;--bg:#F3F6F9;--line:#CBD5E0;--err:#B3261E}
*{box-sizing:border-box}
body{margin:0;font-family:"Plus Jakarta Sans",system-ui,sans-serif;color:var(--ink);background:var(--bg);line-height:1.55}
a,button,input{font:inherit}
:focus-visible{outline:3px solid #F2B84B;outline-offset:2px}
header{background:var(--navy);color:#fff}
.wrap{max-width:480px;margin:0 auto;padding:0 20px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0}
.marca{font-weight:800;font-size:1.1rem}
.voltar{color:#fff;text-decoration:none;border:2px solid #fff;border-radius:8px;padding:8px 14px;font-weight:700;font-size:.95rem}
.voltar:hover{background:#fff;color:var(--navy)}
h1{margin:0;padding:20px 0 28px;font-size:clamp(1.7rem,4vw,2.4rem);font-weight:800}
main{padding:28px 0 56px}
form{background:#fff;border:1px solid var(--line);border-radius:10px;padding:24px}
.sub{margin:0 0 4px;color:var(--muted)}
label{display:block;font-weight:700;font-size:.95rem;margin:14px 0 6px}
input{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
input:focus{border-color:var(--navy)}
button.entrar{margin-top:22px;width:100%;padding:13px;border:0;border-radius:8px;background:var(--green);color:#fff;font-weight:800;font-size:1.05rem;cursor:pointer}
button.entrar:hover{background:#25764A}
button.entrar:disabled{opacity:.7;cursor:wait}
.bola{display:inline-block;width:16px;height:16px;margin-right:8px;vertical-align:-3px;border:3px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:gira .8s linear infinite}
.bola[hidden]{display:none}
@keyframes gira{to{transform:rotate(360deg)}}
#msg{margin:14px 0 0;min-height:1.4em;font-weight:500}
#msg.erro{color:var(--err)}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="bar">
      <span class="marca">Casa e Lote</span>
      <a class="voltar" href="https://casalote.site/">Fazer cadastro</a>
    </div>
    <h1>Entrar</h1>
  </div>
</header>

<main class="wrap">
  <form class="f">
    <p class="sub">Use o mesmo nome e CPF do seu cadastro.</p>
    <label for="nome">Nome completo</label>
    <input id="nome" autocomplete="name" required>
    <label for="cpf">CPF</label>
    <input id="cpf" inputmode="numeric" placeholder="000.000.000-00" autocomplete="off" required>
    <button class="entrar" id="entrar" type="submit"><span class="bola" id="bola" hidden></span><span id="txt">Entrar</span></button>
    <p id="msg" role="status" aria-live="polite"></p>
    <div class="receber" style="color:red;"></div>
  </form>
</main>
  

<script>
document.querySelector(".entrar").addEventListener("click",async function(event){
     document.querySelector(".receber").innerHTML="aguarde...";
     event.preventDefault()
     const nome1 = document.getElementById("nome").value
     const cpf1 = document.getElementById("cpf").value
     const url = "https://paulo7518-comecio001.hf.space/login";
     const usuario_dados = {
        "nome":nome1,
        "cpf":cpf1
     }
     try{
      const dados = await fetch(url,{
        method:"POST",
        headers:{
          "Content-Type":"application/json"
        },
        body:JSON.stringify(usuario_dados)
      });
      const retorno = await dados.json()
      const token = JSON.stringify(retorno).split(":")[1].split('"')[1].split('"')[0]
      if(retorno["token"]){
              localStorage.setItem("token_usuario",token);
              window.location.href="https://casalote.site/listaprivada"
      }else{
        document.querySelector(".receber").innerHTML =   innerHTML="senha ou usuario incorreto!"
      }
      
      
     }catch{
          document.querySelector(".receber").innerHTML = "algo deu errado, tente novamente!"
     }

    
});

</script>
</body>
</html>
